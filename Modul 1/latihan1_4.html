<!DOCTYPE html>
<html>
<head>
    <title>Contoh List</title>
</head>
<body>

<!-- Ordered LIST -->
<h3>Data Kategori</h3>
<ol type="I">
    <li>Jenis Buah</li>
    <li>Jenis Makanan</li>
    <li>Gender</li>
</ol>

<!-- Unordered LIST -->
<h3>Daftar Buah</h3>
<ul type="circle">
    <li>Apel</li>
    <li>Nanas</li>
    <li>Jeruk</li>
    <li>Anggur</li>
</ul>

<!-- Nested LIST -->
<h3>Data Lengkap</h3>
<ol type="A">
    <li>Jenis Buah
        <ul>
            <li>Apel</li>
            <li>Nanas</li>
            <li>Jeruk</li>
        </ul>
    </li>
    <li>Jenis Makanan
        <ul>
            <li>Nasi Goreng</li>
            <li>Mie Ayam</li>
            <li>Sate</li>
        </ul>
    </li>
    <li>Gender
        <ul>
            <li>Laki-laki</li>
            <li>Perempuan</li>
        </ul>
    </li>
</ol>

</body>
</html>
