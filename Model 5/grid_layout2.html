<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Grid Layout Modern</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #eef2f3;
      text-align: center;
    }

    h2 {
      margin-top: 30px;
    }

    /* CARD */
    .card {
      background: white;
      margin: 20px auto;
      padding: 20px;
      width: 85%;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    /* GRID */
    .grid-container {
      display: grid;
      gap: 20px;
      background: linear-gradient(45deg, #2196f3, #21cbf3);
      padding: 15px;
      border-radius: 10px;
      grid-template-columns: repeat(4, 1fr);
    }

    /* ITEM */
    .item, .item1 {
      background: rgba(255,255,255,0.9);
      padding: 20px;
      font-size: 25px;
      border-radius: 10px;
      transition: 0.3s;
    }

    .item:hover, .item1:hover {
      transform: scale(1.05);
      background: white;
    }

    /* ITEM KHUSUS */
    .item1 {
      grid-column: 1 / 3;
      font-weight: bold;
      background: #ffeb3b;
    }

    /* KESIMPULAN */
    .kesimpulan {
      margin-top: 15px;
      background: #f9f9f9;
      padding: 10px;
      border-left: 5px solid teal;
      border-radius: 6px;
      text-align: left;
    }

    @media(max-width: 600px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
      }

      .item1 {
        grid-column: 1 / 3;
      }
    }
  </style>
</head>

<body>

<h2>✨ Latihan CSS Grid</h2>

<div class="card">

  <div class="grid-container">
    <div class="item1">1 (Lebar 2 Kolom)</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item">8</div>
  </div>

  <div class="kesimpulan">
    <b>Kesimpulan:</b> CSS Grid digunakan untuk mengatur tata letak elemen.
    Properti <b>grid-column: 1 / 3</b> membuat item pertama melebar dari kolom 1 sampai kolom 3.
  </div>

</div>

</body>
</html>
