<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Belajar Flex Box</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #eef2f3;
            text-align: center;
        }

        h2 {
            margin-top: 20px;
        }

        /* CONTAINER */
        .wadah-flex {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap;
        }

        /* ITEM */
        .wadah-flex div {
            background: linear-gradient(45deg, #2196F3, #21CBF3);
            color: white;
            padding: 30px;
            font-size: 30px;
            width: 100px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .wadah-flex div:hover {
            transform: scale(1.1);
            background: linear-gradient(45deg, #0d8bf2, #00bcd4);
        }

        /* KESIMPULAN */
        .card {
            background: white;
            margin: 20px auto;
            padding: 15px;
            width: 60%;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        @media(max-width: 600px) {
            .card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<h2>✨ Belajar Flexbox</h2>

<div class="wadah-flex">
    <div>1</div>
    <div>2</div>
    <div>3</div>
</div>
