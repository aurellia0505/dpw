<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form HTML</title>
</head>

<body>

<h1 align="center">Form Pendaftaran Mahasiswa</h1>

<form>
<table align="center" cellpadding="5">

<tr>
    <td>Nama</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td>TTL</td>
    <td>
        <input type="text" placeholder="Tempat">
        <input type="date">
    </td>
</tr>

<tr>
    <td>Agama</td>
    <td>
        <select>
            <option>Islam</option>
            <option>Kristen</option>
        </select>
    </td>
</tr>

<tr>
    <td>JK</td>
    <td>
        <input type="radio" name="jk"> L
        <input type="radio" name="jk"> P
    </td>
</tr>

<tr>
    <td>No Ijazah</td>
    <td><input type="text"></td>
</tr>

<tr>
    <td>Alamat</td>
    <td><textarea></textarea></td>
</tr>

<tr>
    <td>Jurusan</td>
    <td>
        <select>
            <option>TI</option>
            <option>SI</option>
        </select>
    </td>
</tr>

<tr>
    <td></td>
    <td>
        <input type="submit" value="Daftar">
        <input type="reset" value="Batal">
    </td>
</tr>

</table>
</form>

<p align="center"><b>Aurellia Zabrina Putri - 253307042</b></p>

</body>
</html>
