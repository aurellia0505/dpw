<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Div dan Span</title>
    <link rel="icon" type="image/png" href="gambar/icon.png" sizes="16x16" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        #berita {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            width: 300px;
            margin: auto;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #berita img {
            width: 100%;
            border-radius: 10px;
        }

        #berita p {
            margin: 10px 0;
            color: #333;
        }

        ul {
            margin-top: 30px;
            list-style: none;
            padding: 0;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
        }

        li {
            background-color: white;
            margin: 8px 0;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .phone {
            color: white;
            background-color: teal;
            padding: 3px 8px;
            border-radius: 5px;
            float: right;
        }

        li:hover {
            background-color: #e0f7fa;
        }
    </style>
</head>
<body>

<div id="berita">
    <img src="gambar/gambar1.jpeg" alt="Gambar Pemandangan">
    <p><b>Gambar ini bagus sekali</b></p>
    <p>Kombinasinya juga sangat menarik dan enak dilihat.</p>
</div>

<ul>
    <li> Putri <span class="phone">0856-4903-8098</span></li>
    <li> Arza  <span class="phone">0856-4903-8098</span></li>
    <li> Zaza  <span class="phone">0856-4903-8098</span></li>
</ul>

</body>
</html>
