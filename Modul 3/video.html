<!DOCTYPE html>
<html lang="en">
<head>
    <title>Halaman Video</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #eef2f3;
        }

        header, footer {
            background: linear-gradient(45deg, teal, darkcyan);
            color: white;
            text-align: center;
            padding: 15px;
        }

        .container {
            display: flex;
        }

        nav {
            width: 25%;
            background: white;
            padding: 15px;
            min-height: 100vh;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
        }

        nav ul { list-style: none; padding: 0; }
        nav ul li { margin: 10px 0; }

        nav a {
            text-decoration: none;
            color: black;
            display: block;
            padding: 8px;
            border-radius: 6px;
            transition: 0.3s;
        }

        nav a:hover {
            background: teal;
            color: white;
        }

        article {
            width: 75%;
            padding: 20px;
        }

        /* CARD VIDEO */
        .video-card {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        video, iframe {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }

        @media(max-width: 768px) {
            .container {
                flex-direction: column;
            }
            nav, article {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>🎥 Halaman Video</h2>
</header>

<div class="container">

<nav>
    <ul>
        <li><a href="#"> Home</a></li>
        <li><a href="#"> Gambar</a></li>
        <li><a href="#"> Event</a></li>
        <li><a href="#"> Audio</a></li>
        <li><a href="#"> Video</a></li>
    </ul>
</nav>

<article>

<h2>Pemutar Video</h2>

<div class="video-card">
    <h3>Video Lokal</h3>
    <video controls>
        <source src="Audio & Vidio/only me . . . (1).mp4" type="video/mp4">
        Browser tidak mendukung video.
    </video>
</div>

<div class="video-card">
    <h3>Video YouTube</h3>
<iframe width="560" height="450" src="https://www.youtube.com/embed/u5G4ndKGXW8?si=T_EghmCSnsEp9ecQ"
    title="YouTube video player" frameborder="0"
    allow="accelerometer; autoplay; clipboard-write;
    allowfullscreen>
</iframe>
</div>

<hr>

<p><b>Kesimpulan:</b> Tag video digunakan untuk file lokal, sedangkan iframe digunakan untuk menampilkan video dari YouTube dengan lebih efisien.</p>

<p><b>Aurellia Zabrina Putri - 253307042</b></p>

</article>

</div>

<footer>
    <p>© 2026 Aurellia</p>
</footer>

</body>
</html>
