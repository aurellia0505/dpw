<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validasi + Confirm Box</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 8px;
            border: 2px solid #ddd;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: #4a90e2;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #357abd;
        }

        /* CONFIRM BOX */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
        }

        .confirm-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            width: 300px;
        }

        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-ok {
            background: #e74c3c;
            color: white;
        }

        .btn-cancel {
            background: #ecf0f1;
        }

        #hasil {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Form Validasi</h2>

    <form name="formku">
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" name="nama" placeholder="Masukkan nama...">
        </div>

        <button type="button" onclick="cekNama()">Kirim</button>
    </form>

    <p id="hasil"></p>
</div>

<!-- CONFIRM BOX -->
<div id="overlay" class="overlay">
    <div class="confirm-box">
        <h3>Konfirmasi</h3>
        <p>Yakin data akan dikirim?</p>

        <div class="btn-group">
            <button class="btn btn-cancel" onclick="pilih(false)">Batal</button>
            <button class="btn btn-ok" onclick="pilih(true)">Kirim</button>
        </div>
    </div>
</div>

<script>
    function cekNama() {
        let nama = document.forms["formku"]["nama"].value;

        if (nama === "") {
            alert("Nama harus diisi!");
            return;
        }

        // tampilkan confirm box
        document.getElementById("overlay").style.display = "block";
    }

    function pilih(setuju) {
        let nama = document.forms["formku"]["nama"].value;

        if (setuju) {
            document.getElementById("hasil").innerHTML =
                "Terima kasih, " + nama + " 😊";
        } else {
            document.getElementById("hasil").innerHTML =
                "Pengiriman dibatalkan ❌";
        }

        document.getElementById("overlay").style.display = "none";
    }
</script>

</body>
</html>
