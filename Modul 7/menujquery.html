<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Navigasi Modern</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: #f4f7f6;
        }

        /* NAVBAR */
        nav {
            background: linear-gradient(90deg, #2c3e50, #34495e);
            display: flex;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        li {
            position: relative;
        }

        li a {
            display: block;
            padding: 15px 25px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
            font-weight: 500;
        }

        li a:hover {
            background: rgba(255,255,255,0.1);
        }

        /* DROPDOWN */
        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            min-width: 200px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .dropdown li a {
            color: #333;
            padding: 12px 20px;
            border-bottom: 1px solid #eee;
        }

        .dropdown li a:hover {
            background: #ecf0f1;
            color: #2c3e50;
        }

        /* ICON PANAH */
        .arrow {
            margin-left: 5px;
            font-size: 12px;
        }

        /* KONTEN */
        .content {
            text-align: center;
            padding: 100px 20px;
        }

        .content h1 {
            color: #2c3e50;
        }
    </style>
</head>

<body>

<nav>
    <ul>
        <li><a href="#">🏠 Beranda</a></li>

        <li class="has-dropdown">
            <a href="#">💼 Layanan <span class="arrow">▼</span></a>
            <ul class="dropdown">
                <li><a href="#">Web Design</a></li>
                <li><a href="#">Mobile App</a></li>
                <li><a href="#">Digital Marketing</a></li>
            </ul>
        </li>

        <li class="has-dropdown">
            <a href="#">📦 Produk <span class="arrow">▼</span></a>
            <ul class="dropdown">
                <li><a href="#">Software Kasir</a></li>
                <li><a href="#">Sistem Absensi</a></li>
            </ul>
        </li>

        <li><a href="#">📖 Tentang Kami</a></li>
    </ul>
</nav>

<div class="content">
    <h1>Selamat Datang 👋</h1>
    <p>Menu navigasi interaktif dengan efek dropdown modern menggunakan jQuery.</p>
</div>

<script>
$(document).ready(function(){

    // Dropdown hover (lebih smooth)
    $(".has-dropdown").hover(
        function() {
            $(this).find(".dropdown")
                .stop(true, true)
                .fadeIn(200)
                .css("transform", "translateY(5px)");
        }, 
        function() {
            $(this).find(".dropdown")
                .stop(true, true)
                .fadeOut(200);
        }
    );

});
</script>

</body>
</html>
