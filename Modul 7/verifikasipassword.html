<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Password Modern</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #ddd;
            margin-top: 5px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5a67d8;
        }

        #hasil {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        /* CONFIRM BOX */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
        }

        .confirm-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 280px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .ok { background: #2ecc71; color: white; }
        .cancel { background: #ddd; }
    </style>
</head>

<body>

<div class="card">
    <h2>Ganti Password 🔐</h2>

    <form name="formtes">
        <div class="input-group">
            <label>Password Baru</label>
            <input type="password" name="password_1" placeholder="Masukkan password">
        </div>

        <div class="input-group">
            <label>Konfirmasi Password</label>
            <input type="password" name="password_2" placeholder="Ulangi password">
        </div>

        <button type="button" onclick="cekPassword()">Proses</button>
    </form>

    <p id="hasil"></p>
</div>

<!-- CONFIRM -->
<div id="overlay" class="overlay">
    <div class="confirm-box">
        <h3>Konfirmasi</h3>
        <p>Yakin ingin mengganti password?</p>

        <div class="btn-group">
            <button class="btn cancel" onclick="pilih(false)">Batal</button>
            <button class="btn ok" onclick="pilih(true)">Ya</button>
        </div>
    </div>
</div>

<script>
    function cekPassword() {
        let pw1 = document.formtes.password_1.value;
        let pw2 = document.formtes.password_2.value;

        if (pw1 === "" || pw2 === "") {
            alert("Password tidak boleh kosong!");
            return;
        }

        if (pw1 !== pw2) {
            alert("Password tidak sama!");
            return;
        }

        // tampilkan confirm
        document.getElementById("overlay").style.display = "block";
    }

    function pilih(setuju) {
        if (setuju) {
            document.getElementById("hasil").innerHTML =
                "Password berhasil diubah ✅";
        } else {
            document.getElementById("hasil").innerHTML =
                "Perubahan dibatalkan ❌";
        }

        document.getElementById("overlay").style.display = "none";
    }
</script>

</body>
</html>
